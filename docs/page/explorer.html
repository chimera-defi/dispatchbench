<p class="meta">Pick any two measures. Purple: no other config beats it on both. Hover or tap a point.</p>
<div class="ctl">
<label>x <select id="ex"></select></label> <label><input type="checkbox" id="lx"> log</label>
<label>y <select id="ey"></select></label> <label><input type="checkbox" id="ly"> log</label>
<label>frontier over <select id="fl"><option value="0">all shown</option><option value="0.75">pass@1 ≥ 75%</option><option value="0.9">pass@1 ≥ 90%</option></select></label>
</div>
<div class="ctl" id="cf"></div>
<figure id="xfig"><div id="xplot"></div><div id="tip" hidden></div>
<figcaption>Function track, L1–L6, 60 attempts per config. Hollow points are exploratory configs. Codex $ is a proxy.</figcaption></figure>
<script>
(function(){
var D=__DATA__;
function tf(k,v){if(k=="pass")return (100*v).toFixed(0)+"%";var t=+v.toPrecision(3);if(k=="usd")return "$"+t;if(k=="med")return t+" s";return t>=1000?(t/1000)+"k":String(t)}
var M={pass:{l:"pass@1",f:function(v){return (100*v).toFixed(0)+"%"},up:1},
 usd:{l:"$ per pass",f:function(v){return "$"+v.toPrecision(2)}},
 med:{l:"median seconds",f:function(v){return v.toFixed(1)+" s"}},
 inp:{l:"input tokens per call",f:function(v){return Math.round(v).toLocaleString()}},
 rsn:{l:"reasoning tokens per call",f:function(v){return Math.round(v).toLocaleString()}}};
var st={x:"usd",y:"med",lx:true,ly:false,fl:"0.9",off:{}};
try{var sv=JSON.parse(localStorage.getItem("rb-x2")||"null");if(sv)st=sv}catch(e){}
var ex=document.getElementById("ex"),ey=document.getElementById("ey");
for(var k in M){ex.add(new Option(M[k].l,k));ey.add(new Option(M[k].l,k))}
var fl=document.getElementById("fl");fl.value=st.fl;fl.onchange=function(){st.fl=fl.value;draw()};ex.value=st.x;ey.value=st.y;document.getElementById("lx").checked=st.lx;document.getElementById("ly").checked=st.ly;
var cf=document.getElementById("cf");
D.forEach(function(d){var l=document.createElement("label");l.innerHTML='<input type="checkbox"'+(st.off[d.c]?"":" checked")+'> <i style="background:'+d.col+'"></i>'+d.c;
 l.firstChild.onchange=function(e){st.off[d.c]=!e.target.checked;draw()};cf.appendChild(l)});
ex.onchange=function(){st.x=ex.value;draw()};ey.onchange=function(){st.y=ey.value;draw()};
document.getElementById("lx").onchange=function(e){st.lx=e.target.checked;draw()};
document.getElementById("ly").onchange=function(e){st.ly=e.target.checked;draw()};
function ticks(lo,hi,log,few){var t=[];if(log){var e0=Math.floor(Math.log10(lo)),e1=Math.ceil(Math.log10(hi));
 for(var e=e0;e<=e1;e++)(few?[1,5]:[1,2,5]).forEach(function(m){var v=m*Math.pow(10,e);if(v>=lo*.999&&v<=hi*1.001)t.push(v)});return t}
 var r=hi-lo,s=Math.pow(10,Math.floor(Math.log10(r/5)));[1,2,2.5,5,10].some(function(m){if(r/(m*s)<=6){s*=m;return true}});
 for(var v=Math.ceil(lo/s)*s;v<=hi+1e-12;v+=s)t.push(+v.toPrecision(10));return t}
function scale(vals,log,a,b,few){var lo=Math.min.apply(0,vals),hi=Math.max.apply(0,vals);
 if(log){lo/=1.5;hi*=1.5}else{var p=(hi-lo||Math.abs(hi)||1)*.12;lo-=p;hi+=p;if(Math.min.apply(0,vals)>=0&&lo<0)lo=0}
 var f=log?function(v){return a+(Math.log(v)-Math.log(lo))/(Math.log(hi)-Math.log(lo))*(b-a)}:function(v){return a+(v-lo)/(hi-lo)*(b-a)};
 return {f:f,t:ticks(lo,hi,log,few)}}
function esc(s){return String(s).replace(/[&<]/g,function(c){return c=="&"?"&amp;":"&lt;"})}
function draw(){try{localStorage.setItem("rb-x2",JSON.stringify(st))}catch(e){}
 var box=document.getElementById("xplot"),W=Math.max(300,box.clientWidth),H=Math.round(Math.min(460,Math.max(300,W*.62)));
 var small=W<500,L=small?62:84,R=small?14:24,T=16,B=small?52:58;
 var pts=D.filter(function(d){return !st.off[d.c]&&d[st.x]>0&&d[st.y]>0});
 var g=[];
 if(!pts.length){box.innerHTML='<p class="meta" style="padding:40px 12px">No configs selected.</p>';return}
 var sx=scale(pts.map(function(d){return d[st.x]}),st.lx,L,W-R,small),sy=scale(pts.map(function(d){return d[st.y]}),st.ly,H-B,T);
 sx.t.forEach(function(v){var x=sx.f(v);if(x<L-1||x>W-R+1)return;g.push('<line x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+(H-B)+'" stroke="#e3e6ea"/><text x="'+x+'" y="'+(H-B+16)+'" text-anchor="middle" fill="#59636e">'+tf(st.x,v)+'</text>')});
 sy.t.forEach(function(v){var y=sy.f(v);if(y>H-B+1||y<T-1)return;g.push('<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#e3e6ea"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" fill="#59636e">'+tf(st.y,v)+'</text>')});
 g.push('<text x="'+((L+W-R)/2)+'" y="'+(H-12)+'" text-anchor="middle" fill="#1f2328">'+M[st.x].l+(st.lx?" (log)":"")+'</text>');
 g.push('<text transform="translate(14,'+((T+H-B)/2)+') rotate(-90)" text-anchor="middle" fill="#1f2328">'+M[st.y].l+(st.ly?" (log)":"")+'</text>');
 function better(a,b,k){return M[k].up?a>=b:a<=b}function strict(a,b,k){return M[k].up?a>b:a<b}
 var cand=pts.filter(function(p){return p.pass>=+st.fl});var fr=cand.filter(function(p){return !cand.some(function(q){return q!==p&&better(q[st.x],p[st.x],st.x)&&better(q[st.y],p[st.y],st.y)&&(strict(q[st.x],p[st.x],st.x)||strict(q[st.y],p[st.y],st.y))})});
 if(st.x!==st.y&&fr.length>1){fr.sort(function(a,b){return a[st.x]-b[st.x]});
  g.push('<polyline fill="none" stroke="#7b4fc9" stroke-width="2" stroke-dasharray="5 4" points="'+fr.map(function(p){return sx.f(p[st.x])+","+sy.f(p[st.y])}).join(" ")+'"/>')}
 var placed=[];
 pts.forEach(function(p,i){var x=sx.f(p[st.x]),y=sy.f(p[st.y]),onf=fr.indexOf(p)>=0;
  g.push('<circle data-i="'+D.indexOf(p)+'" cx="'+x+'" cy="'+y+'" r="7" fill="'+(p.exp?"#fff":p.col)+'" stroke="'+(onf?"#7b4fc9":p.col)+'" stroke-width="'+(onf?3:2)+'" style="cursor:pointer"/>')});
 pts.slice().sort(function(a,b){return sy.f(a[st.y])-sy.f(b[st.y])}).forEach(function(p){var x=sx.f(p[st.x]),y=sy.f(p[st.y]),w=p.c.length*(small?5.6:6.4)+4;
  var right=x+12+w>W-R,lx=right?x-12-w:x+12,ly=y+4;
  for(var n=0;n<8&&placed.some(function(r){return Math.abs(r[1]-ly)<13&&lx<r[0]+r[2]&&r[0]<lx+w});n++)ly+=(n%2?-1:1)*13*(n+1);
  ly=Math.min(ly,H-B-4);placed.push([lx,ly,w]);g.push('<text x="'+lx+'" y="'+ly+'" fill="'+(p.exp?"#59636e":"#1f2328")+'" pointer-events="none">'+esc(p.c)+'</text>')});
 box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="'+(small?11:12)+'" role="img" aria-label="'+M[st.y].l+' against '+M[st.x].l+'">'+g.join("")+'</svg>';
 box.querySelectorAll("circle").forEach(function(c){function show(){var d=D[+c.getAttribute("data-i")],t=document.getElementById("tip");
   t.innerHTML='<b>'+esc(d.c)+'</b>'+(d.exp?' <span class="tag">exploratory</span>':'')+'<br>'+Object.keys(M).map(function(k){return M[k].l+': '+M[k].f(d[k])}).join("<br>")+'<br>$ kind: '+d.kind;
   t.hidden=false;var bx=box.getBoundingClientRect(),cx=+c.getAttribute("cx"),cy=+c.getAttribute("cy");
   t.style.left=Math.min(cx+12,bx.width-t.offsetWidth-4)+"px";t.style.top=Math.max(0,cy-t.offsetHeight-10)+"px"}
  c.onmouseenter=show;c.onclick=show;c.onmouseleave=function(){document.getElementById("tip").hidden=true}})}
var rt,lw=0,bx=document.getElementById("xplot");function re(){var w=bx.clientWidth;if(w!==lw){lw=w;clearTimeout(rt);rt=setTimeout(draw,60)}}if(window.ResizeObserver)new ResizeObserver(re).observe(bx);window.addEventListener("resize",re);draw()})();
</script>
